DEFAULT jaglinux
TIMEOUT 30
PROMPT 0

UI menu.c32

MENU TITLE JAG Linux 1.0 — Just Are Good Linux

LABEL jaglinux
    MENU LABEL JAG Linux Live (amd64)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.img boot=casper quiet splash ---
    TEXT HELP
    Загрузить JAG Linux в live-режиме
    ENDTEXT

LABEL jaglinux-safe
    MENU LABEL JAG Linux Live (безопасный режим)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.img boot=casper nomodeset quiet splash ---
    TEXT HELP
    Загрузить JAG Linux без KMS (для старых видеокарт)
    ENDTEXT

LABEL jaglinux-text
    MENU LABEL JAG Linux Live (текстовый режим)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.img boot=casper textonly ---

LABEL memtest
    MENU LABEL Проверка памяти (memtest86+)
    KERNEL /boot/memtest86+

LABEL hd
    MENU LABEL Загрузить с жёсткого диска
    LOCALBOOT 0x80
