set default=0
set timeout=30

insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "JAG Linux Live (amd64)" --class gnu-linux --class os {
    linux  /boot/vmlinuz boot=casper quiet splash ---
    initrd /boot/initrd.img
}

menuentry "JAG Linux Live (безопасный режим)" --class gnu-linux {
    linux  /boot/vmlinuz boot=casper nomodeset quiet splash ---
    initrd /boot/initrd.img
}

menuentry "JAG Linux Live (текстовый режим)" --class gnu-linux {
    linux  /boot/vmlinuz boot=casper textonly ---
    initrd /boot/initrd.img
}

menuentry "Загрузить с жёсткого диска" --class windows {
    insmod chain
    insmod part_gpt
    chainloader (hd0,gpt1)/EFI/Microsoft/Boot/bootmgfw.efi
}
