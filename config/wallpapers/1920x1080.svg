<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#0a0e1a"/>
      <stop offset="50%"  style="stop-color:#0d1f3c"/>
      <stop offset="100%" style="stop-color:#091428"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#4fc3f7;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0288d1;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1a3a6e" stroke-width="1" opacity="0.3">
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="320"  y1="0" x2="320"  y2="1080"/>
    <line x1="640"  y1="0" x2="640"  y2="1080"/>
    <line x1="960"  y1="0" x2="960"  y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>

  <!-- Accent circles -->
  <circle cx="960" cy="540" r="300" fill="none" stroke="#1e4a8a" stroke-width="1" opacity="0.4"/>
  <circle cx="960" cy="540" r="200" fill="none" stroke="#2a5fa0" stroke-width="1" opacity="0.3"/>

  <!-- JAG Logo text -->
  <text x="960" y="490" font-family="monospace" font-size="130" font-weight="bold"
        fill="url(#glow)" text-anchor="middle" letter-spacing="8">JAG</text>
  <text x="960" y="580" font-family="monospace" font-size="42"
        fill="#81d4fa" text-anchor="middle" letter-spacing="12" opacity="0.9">LINUX</text>

  <!-- Tagline -->
  <line x1="600" y1="615" x2="1320" y2="615" stroke="#4fc3f7" stroke-width="1" opacity="0.4"/>
  <text x="960" y="650" font-family="monospace" font-size="22"
        fill="#4fc3f7" text-anchor="middle" opacity="0.6" letter-spacing="4">Just Are Good Linux</text>
</svg>
