DEFAULT jaglinux
TIMEOUT 300
PROMPT 0
UI vesamenu.c32
MENU BACKGROUND splash.png

MENU TITLE JAG Linux 1.0 -- Just Are Good Linux

MENU WIDTH 50
MENU MARGIN 10
MENU ROWS 5
MENU VSHIFT 18
MENU HSHIFT 26
MENU TABMSGROW 24
MENU CMDLINEROW 24
MENU HELPMSGROW 26
MENU HELPMSGENDROW 29

MENU COLOR title    1;36;40 #ff4fc3f7 #00000000
MENU COLOR sel      7;37;40 #ffffffff #ff4fc3f7
MENU COLOR unsel    37;44   #cfcfcfcf #00000000
MENU COLOR border   30;44   #ff4fc3f7 #00000000
MENU COLOR tabmsg   31;40   #ff4fc3f7 #00000000
MENU COLOR timeout  1;37;40 #c0ffffff #00000000

LABEL jaglinux
    MENU LABEL JAG Linux 1.0 (64-bit)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.gz modules=loop,squashfs,sd-mod,usb-storage quiet console=tty1

LABEL jaglinux-debug
    MENU LABEL JAG Linux 1.0 (debug mode)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.gz modules=loop,squashfs,sd-mod,usb-storage console=tty1

LABEL hd
    MENU LABEL Boot from hard drive
    LOCALBOOT 0x80
