name: Build JAG Linux ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          build-essential gcc make bc flex bison \
          libssl-dev libelf-dev libncurses-dev \
          cpio gzip xz-utils \
          genisoimage isolinux syslinux-common \
          wget curl git

    - name: Download Linux kernel 6.6 LTS
      run: |
        wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.30.tar.xz
        tar -xf linux-6.6.30.tar.xz
        mv linux-6.6.30 linux-src

    - name: Apply JAG Linux kernel patches
      run: |
        cd linux-src
        # Apply custom panic screen patch
        patch -p1 < ../jag-linux/kernel/patches/0001-jag-panic-screen.patch || true
        echo "Patches applied"

    - name: Configure kernel
      run: |
        cd linux-src
        # Start from x86_64 defconfig as a solid base
        make x86_64_defconfig
        # Apply JAG Linux customizations on top
        ./scripts/config --set-str CONFIG_LOCALVERSION "-jaglinux"
        ./scripts/config --enable CONFIG_DEVTMPFS
        ./scripts/config --enable CONFIG_DEVTMPFS_MOUNT
        ./scripts/config --enable CONFIG_SQUASHFS
        ./scripts/config --enable CONFIG_SQUASHFS_XZ
        ./scripts/config --enable CONFIG_OVERLAY_FS
        ./scripts/config --enable CONFIG_BLK_DEV_RAM
        ./scripts/config --set-val CONFIG_BLK_DEV_RAM_SIZE 65536
        ./scripts/config --enable CONFIG_VIRTIO
        ./scripts/config --enable CONFIG_VIRTIO_PCI
        ./scripts/config --enable CONFIG_VIRTIO_BLK
        ./scripts/config --enable CONFIG_VIRTIO_NET
        ./scripts/config --enable CONFIG_VIRTIO_CONSOLE
        ./scripts/config --enable CONFIG_FB_VESA
        ./scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
        ./scripts/config --set-val CONFIG_PANIC_TIMEOUT 30
        ./scripts/config --enable CONFIG_PANIC_ON_OOPS
        make olddefconfig

    - name: Build kernel
      run: |
        cd linux-src
        make -j$(nproc) bzImage 2>&1 | tail -20
        echo "Kernel built: $(ls -lh arch/x86/boot/bzImage)"

    - name: Download static busybox
      run: |
        wget -q https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox \
          -O busybox-static
        chmod +x busybox-static

    - name: Build initramfs
      run: |
        mkdir -p initramfs/{bin,sbin,etc/init.d,proc,sys,dev,tmp,root,run,home/jag}

        # Install busybox
        cp busybox-static initramfs/bin/busybox
        chmod 755 initramfs/bin/busybox

        # Create busybox symlinks
        for cmd in sh ash ls cat echo cp mv rm mkdir rmdir touch \
                   mount umount grep sed awk cut sort uniq head tail wc \
                   find chmod chown ln pwd df du free top ps kill \
                   sleep date uname hostname ip ping wget tar gzip \
                   gunzip vi more less clear reset reboot poweroff \
                   dmesg mknod id whoami; do
          ln -sf /bin/busybox initramfs/bin/$cmd
        done
        ln -sf /bin/busybox initramfs/sbin/init
        ln -sf /bin/busybox initramfs/sbin/getty

        # sudo wrapper
        cat > initramfs/bin/sudo << 'SUDOEOF'
        #!/bin/sh
        if [ -z "$1" ]; then echo "usage: sudo COMMAND"; exit 1; fi
        exec "$@"
        SUDOEOF
        chmod 755 initramfs/bin/sudo

        # /etc/passwd
        cat > initramfs/etc/passwd << 'EOF'
        root:x:0:0:root:/root:/bin/sh
        jag:x:1000:1000:JAG User:/home/jag:/bin/sh
        EOF

        cat > initramfs/etc/group << 'EOF'
        root:x:0:root
        jag:x:1000:jag
        EOF

        # /etc/inittab
        cat > initramfs/etc/inittab << 'EOF'
        ::sysinit:/etc/init.d/rcS
        ::respawn:/bin/sh
        ::ctrlaltdel:/bin/reboot
        ::shutdown:/bin/umount -a -r
        EOF

        # /etc/init.d/rcS
        cat > initramfs/etc/init.d/rcS << 'EOF'
        #!/bin/sh
        mount -t proc proc /proc
        mount -t sysfs sysfs /sys
        mount -t devtmpfs devtmpfs /dev
        mknod -m 666 /dev/tty1    c 4 1 2>/dev/null || true
        mknod -m 666 /dev/console c 5 1 2>/dev/null || true
        mknod -m 666 /dev/null    c 1 3 2>/dev/null || true
        mkdir -p /dev/pts
        mount -t devpts devpts /dev/pts 2>/dev/null || true
        mount -t tmpfs tmpfs /tmp
        mount -t tmpfs tmpfs /run
        echo "jaglinux" > /proc/sys/kernel/hostname
        ip link set lo up 2>/dev/null || true
        clear
        cat /etc/issue
        EOF
        chmod 755 initramfs/etc/init.d/rcS

        # /etc/issue
        cat > initramfs/etc/issue << 'EOF'
        Jag Linux v1.0 beta
        All copying to third-party resources is permitted with the indication of the author
        If you don't know the command, type jag-help or visit: https://jaglinux.example.com

        EOF

        # /etc/profile
        cat > initramfs/etc/profile << 'EOF'
        export PATH=/bin:/sbin:/usr/bin:/usr/sbin
        export HOME=/root
        export TERM=linux
        export PS1='[JAG \w]# '
        alias ll='ls -lh --color=auto'
        alias la='ls -A --color=auto'
        EOF

        # jag-help
        cp jag-linux/scripts/jag-help initramfs/bin/jag-help 2>/dev/null || \
        cat > initramfs/bin/jag-help << 'EOF'
        #!/bin/sh
        echo "jag-help -type:all   show all commands"
        echo "jag-help -type:CMD   command info"
        EOF
        chmod 755 initramfs/bin/jag-help

        # /init
        cat > initramfs/init << 'EOF'
        #!/bin/sh
        exec /sbin/init
        EOF
        chmod 755 initramfs/init

        # Pack initramfs
        cd initramfs
        find . | cpio -H newc -o --owner=0:0 | gzip -9 > ../initrd.gz
        cd ..
        echo "initrd.gz: $(du -sh initrd.gz | cut -f1)"

    - name: Build ISO
      run: |
        mkdir -p iso_root/{boot,isolinux}

        # Kernel and initrd
        cp linux-src/arch/x86/boot/bzImage iso_root/boot/vmlinuz
        cp initrd.gz iso_root/boot/initrd.gz

        # Isolinux bootloader
        cp /usr/lib/ISOLINUX/isolinux.bin iso_root/isolinux/
        cp /usr/lib/syslinux/modules/bios/ldlinux.c32  iso_root/isolinux/
        cp /usr/lib/syslinux/modules/bios/libcom32.c32 iso_root/isolinux/
        cp /usr/lib/syslinux/modules/bios/libutil.c32  iso_root/isolinux/
        cp /usr/lib/syslinux/modules/bios/vesamenu.c32 iso_root/isolinux/

        # Splash screen
        cp jag-linux/config/wallpapers/splash.png iso_root/isolinux/ 2>/dev/null || true

        # isolinux.cfg
        cat > iso_root/isolinux/isolinux.cfg << 'EOF'
        DEFAULT jaglinux
        TIMEOUT 300
        PROMPT 0
        UI vesamenu.c32
        MENU BACKGROUND splash.png
        MENU TITLE JAG Linux 1.0

        MENU COLOR title    1;36;44 #ff4fc3f7 #00000000 std
        MENU COLOR sel      7;37;40 #ffffffff #ff4fc3f7 std
        MENU COLOR unsel    37;44   #cfcfcfcf #00000000 std

        LABEL jaglinux
            MENU LABEL JAG Linux 1.0 (64-bit)
            KERNEL /boot/vmlinuz
            APPEND initrd=/boot/initrd.gz console=ttyS0,115200 console=tty1

        LABEL jaglinux-debug
            MENU LABEL JAG Linux 1.0 (debug mode)
            KERNEL /boot/vmlinuz
            APPEND initrd=/boot/initrd.gz console=ttyS0,115200 console=tty1 debug

        LABEL hd
            MENU LABEL Boot from hard drive
            LOCALBOOT 0x80
        EOF

        # Build ISO
        genisoimage \
          -o jaglinux-1.0-amd64.iso \
          -b isolinux/isolinux.bin \
          -c isolinux/boot.cat \
          -no-emul-boot \
          -boot-load-size 4 \
          -boot-info-table \
          -V JAGLINUX \
          -J -r \
          iso_root

        echo "ISO built: $(du -sh jaglinux-1.0-amd64.iso | cut -f1)"

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: jaglinux-1.0-amd64
        path: jaglinux-1.0-amd64.iso
        retention-days: 30

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: jaglinux-kernel
        path: linux-src/arch/x86/boot/bzImage
        retention-days: 30
