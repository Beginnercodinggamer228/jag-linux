name: Build JAG Linux ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y wget xorriso isolinux syslinux-common cpio gzip

    - name: Download Alpine Linux
      run: |
        wget -q https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/x86_64/alpine-standard-3.19.1-x86_64.iso
        echo "Alpine: $(du -sh alpine-standard-3.19.1-x86_64.iso | cut -f1)"

    - name: Extract Alpine ISO
      run: |
        mkdir -p alpine_mnt alpine_extract
        sudo mount -o loop alpine-standard-3.19.1-x86_64.iso alpine_mnt
        cp -r alpine_mnt/. alpine_extract/
        sudo umount alpine_mnt

    - name: Modify Alpine initramfs
      run: |
        mkdir -p initramfs_work
        cd initramfs_work
        gunzip -c ../alpine_extract/boot/initramfs-lts | cpio -idm 2>/dev/null || true

        mkdir -p usr/local/bin etc/profile.d

        cp ../rootfs-files/issue etc/issue
        cp ../rootfs-files/jag-help usr/local/bin/jag-help
        cp ../rootfs-files/sudo usr/local/bin/sudo
        cp ../rootfs-files/profile.d-jag.sh etc/profile.d/jag.sh
        chmod 755 usr/local/bin/jag-help usr/local/bin/sudo etc/profile.d/jag.sh

        find . | cpio -H newc -o --owner=0:0 2>/dev/null | gzip -9 > ../initramfs-jag.gz
        cd ..
        echo "initramfs: $(du -sh initramfs-jag.gz | cut -f1)"

    - name: Build ISO
      run: |
        mkdir -p iso_root/boot iso_root/isolinux

        cp alpine_extract/boot/vmlinuz-lts iso_root/boot/vmlinuz
        cp initramfs-jag.gz iso_root/boot/initrd.gz

        cp /usr/lib/ISOLINUX/isolinux.bin              iso_root/isolinux/
        cp /usr/lib/syslinux/modules/bios/ldlinux.c32  iso_root/isolinux/
        cp /usr/lib/syslinux/modules/bios/libcom32.c32 iso_root/isolinux/
        cp /usr/lib/syslinux/modules/bios/libutil.c32  iso_root/isolinux/
        cp /usr/lib/syslinux/modules/bios/menu.c32     iso_root/isolinux/

        cp iso_build/isolinux/splash.png iso_root/isolinux/ 2>/dev/null || true
        cp rootfs-files/isolinux.cfg iso_root/isolinux/isolinux.cfg

        xorriso -as mkisofs \
          -o jaglinux-1.0-amd64.iso \
          -b isolinux/isolinux.bin \
          -c isolinux/boot.cat \
          -no-emul-boot \
          -boot-load-size 4 \
          -boot-info-table \
          -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
          -V "JAGLINUX" \
          -J -r \
          iso_root

        echo "ISO: $(du -sh jaglinux-1.0-amd64.iso | cut -f1)"

    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: jaglinux-1.0-amd64
        path: jaglinux-1.0-amd64.iso
        retention-days: 30
